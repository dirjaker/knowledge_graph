<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识图谱系统</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
/* Tooltip */
.tooltip {
  position: fixed;
  padding: 6px 10px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-primary);
  border-radius: 6px;
  font-size: 11px;
  color: var(--text-primary);
  pointer-events: none;
  z-index: 999;
  box-shadow: var(--shadow-md);
  max-width: 300px;
}
.tooltip .tip-type { color: var(--text-secondary); font-size: 10px; }
.tooltip .tip-desc { color: var(--text-secondary); margin-top: 2px; font-size: 10px; }

/* Graph node/edge highlight */
.node-highlight { filter: brightness(1.3); }
.node-dimmed { opacity: 0.15; }
.edge-highlight { stroke-opacity: 0.8 !important; }
.edge-dimmed { stroke-opacity: 0.05 !important; }

/* Structured query form */
.structured-form { margin-top: 16px; padding: 16px; background: var(--bg-tertiary); border-radius: 8px; }
.structured-form .form-group { margin-bottom: 12px; }
.structured-form .form-group label { display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }

/* Community tags */
.community-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; margin: 2px; background: var(--bg-tertiary); color: var(--text-primary); }

/* Path highlight */
.path-highlight { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--bg-tertiary); border-radius: 6px; margin-bottom: 4px; font-size: 12px; flex-wrap: wrap; }
.path-node { color: var(--accent); font-weight: 600; }
.path-edge { color: var(--text-secondary); font-size: 11px; }
</style>
</head>
<body>
<div id="app" class="app-layout">
  <!-- 左侧导航栏 -->
  <nav class="nav-rail">
    <div class="nav-logo">KG</div>
    <div class="nav-items">
      <div class="nav-item" :class="{active: page==='graph'}" @click="page='graph'" title="图谱">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="4" cy="6" r="2"/><circle cx="20" cy="6" r="2"/><circle cx="4" cy="18" r="2"/><circle cx="20" cy="18" r="2"/><line x1="6" y1="6" x2="10" y2="10"/><line x1="18" y1="6" x2="14" y2="10"/><line x1="6" y1="18" x2="10" y2="14"/><line x1="18" y1="18" x2="14" y2="14"/></svg>
      </div>
      <div class="nav-item" :class="{active: page==='import'}" @click="page='import'" title="导入">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </div>
      <div class="nav-item" :class="{active: page==='query'}" @click="page='query'" title="查询">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <div class="nav-item" :class="{active: page==='analysis'}" @click="page='analysis'" title="分析">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      </div>
    </div>
    <div class="nav-bottom">
      <div class="nav-item" :class="{active: page==='settings'}" @click="page='settings'" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </div>
      <div class="nav-item" @click="cycleTheme" title="切换主题">
        <svg v-if="theme==='dark'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg v-else-if="theme==='light'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg v-else viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      </div>
    </div>
  </nav>

  <!-- 主内容区 -->
  <div class="main-content">
    <!-- ============ 图谱页面 ============ -->
    <template v-if="page==='graph'">
      <div class="toolbar">
        <div class="toolbar-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="4" cy="6" r="2"/><circle cx="20" cy="6" r="2"/><line x1="6" y1="6" x2="10" y2="10"/><line x1="18" y1="6" x2="14" y2="10"/></svg>
          知识图谱
        </div>
        <input class="input" style="width:260px" placeholder="搜索实体..." v-model="graphSearch" @keyup.enter="searchGraphNodes">
        <select class="select" v-model="graphTypeFilter" @change="loadGraphData">
          <option value="">全部类型</option>
          <option value="person">人物</option>
          <option value="organization">组织</option>
          <option value="location">地点</option>
          <option value="technology">技术</option>
          <option value="concept">概念</option>
          <option value="event">事件</option>
          <option value="product">产品</option>
        </select>
        <select class="select" v-model="graphLayout" @change="relayoutGraph">
          <option value="force">力导向</option>
          <option value="circular">环形</option>
          <option value="grid">网格</option>
        </select>
        <button class="btn btn-secondary btn-sm" @click="resetGraph">重置视图</button>
        <div class="toolbar-spacer"></div>
        <span style="font-size:11px;color:var(--text-tertiary)">
          节点 <span style="color:var(--text-primary);font-weight:600">{{graphStats.nodeCount}}</span>
          &nbsp;|&nbsp;
          边 <span style="color:var(--text-primary);font-weight:600">{{graphStats.edgeCount}}</span>
        </span>
      </div>
      <div class="graph-layout">
        <!-- 左侧实体列表 -->
        <div class="entity-sidebar">
          <div class="entity-sidebar-header">
            <input class="input" placeholder="过滤实体..." v-model="entityFilter" @input="filterEntities">
            <div class="type-filters">
              <span class="type-filter" :class="{active: entityTypeFilter===''}" @click="entityTypeFilter='';filterEntities()">全部</span>
              <span class="type-filter" v-for="t in entityTypes" :key="t.value" :class="{active: entityTypeFilter===t.value}" :style="{borderLeftColor: t.color, borderLeftWidth: '3px'}" @click="entityTypeFilter=t.value;filterEntities()">{{t.label}}</span>
            </div>
          </div>
          <div class="entity-count">显示 <strong>{{filteredEntities.length}}</strong> 个实体</div>
          <div class="entity-list">
            <div class="entity-item" v-for="e in filteredEntities" :key="e.name" :class="{active: selectedEntity&&selectedEntity.name===e.name}" @click="selectEntity(e)">
              <span class="entity-dot" :style="{background: getTypeColor(e.entity_type)}"></span>
              <div class="entity-info">
                <div class="entity-name">{{e.name}}</div>
                <div class="entity-meta">{{getTypeLabel(e.entity_type)}}</div>
              </div>
            </div>
            <div v-if="filteredEntities.length===0" class="empty-state" style="padding:24px">
              <p>暂无实体</p>
            </div>
          </div>
        </div>

        <!-- 图谱画布 -->
        <div class="graph-canvas-wrapper" ref="graphCanvas">
          <svg ref="graphSvg"></svg>
          <div class="graph-controls">
            <button class="btn btn-ghost btn-icon btn-sm" @click="zoomIn" title="放大">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <button class="btn btn-ghost btn-icon btn-sm" @click="zoomOut" title="缩小">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <button class="btn btn-ghost btn-icon btn-sm" @click="fitGraph" title="适应">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
            </button>
          </div>
          <div class="graph-status">
            缩放: <span>{{Math.round(graphZoom*100)}}%</span>
          </div>
        </div>

        <!-- 右侧详情面板 -->
        <div class="detail-panel" :class="{collapsed: !selectedEntity}">
          <template v-if="selectedEntity">
            <div class="detail-header">
              <div>
                <div class="detail-title">{{selectedEntity.name}}</div>
                <span class="badge" :class="'badge-'+selectedEntity.entity_type" style="margin-top:4px">{{getTypeLabel(selectedEntity.entity_type)}}</span>
              </div>
              <button class="btn btn-ghost btn-icon btn-sm" @click="selectedEntity=null">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
            <div class="detail-body">
              <div class="detail-section" v-if="selectedEntity.description">
                <div class="detail-section-title">描述</div>
                <p style="font-size:12px;color:var(--text-primary);line-height:1.6">{{selectedEntity.description}}</p>
              </div>
              <div class="detail-section">
                <div class="detail-section-title">属性</div>
                <div class="detail-row"><span class="detail-label">置信度</span><span class="detail-value">{{selectedEntity.confidence}}</span></div>
                <div class="detail-row"><span class="detail-label">创建时间</span><span class="detail-value">{{selectedEntity.created_at}}</span></div>
              </div>
              <div class="detail-section">
                <div class="detail-section-title">关系 ({{entityRelations.length}})</div>
                <div class="relation-item" v-for="r in entityRelations" :key="r.id" @click="highlightRelation(r)">
                  <span class="relation-arrow" v-if="r.source===selectedEntity.name">→</span>
                  <span class="relation-arrow" v-else>←</span>
                  <span>{{r.source===selectedEntity.name ? r.target : r.source}}</span>
                  <span style="color:var(--text-tertiary);font-size:10px">[{{r.type}}]</span>
                </div>
                <div v-if="entityRelations.length===0" style="font-size:12px;color:var(--text-tertiary)">暂无关系</div>
              </div>
            </div>
            <div class="detail-actions">
              <button class="btn btn-secondary btn-sm" @click="expandNeighbors">展开邻居</button>
              <button class="btn btn-danger btn-sm" @click="deleteSelectedEntity">删除</button>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- ============ 导入页面 ============ -->
    <template v-if="page==='import'">
      <div class="toolbar">
        <div class="toolbar-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          数据导入
        </div>
      </div>
      <div class="page-content">
        <div class="import-layout">
          <div class="import-tabs">
            <div class="import-tab" :class="{active: importTab==='text'}" @click="importTab='text'">文本粘贴</div>
            <div class="import-tab" :class="{active: importTab==='file'}" @click="importTab='file'">文件上传</div>
            <div class="import-tab" :class="{active: importTab==='manual'}" @click="importTab='manual'">手动添加</div>
          </div>

          <!-- 文本粘贴 -->
          <div v-if="importTab==='text'">
            <textarea class="text-input-area" v-model="importText" placeholder="粘贴或输入文本内容...&#10;&#10;支持新闻文章、论文摘要、技术文档等，系统将自动识别并提取其中的实体和关系。"></textarea>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
              <span style="font-size:11px;color:var(--text-tertiary)">建议不超过5000字以获得最佳效果</span>
              <button class="btn btn-primary" @click="startIngest" :disabled="!importText.trim()||importLoading">
                <span class="spinner" v-if="importLoading"></span>
                {{importLoading ? '分析中...' : '开始分析'}}
              </button>
            </div>
          </div>

          <!-- 文件上传 -->
          <div v-if="importTab==='file'">
            <div class="upload-zone" @click="$refs.fileInput.click()" @dragover.prevent @drop.prevent="handleFileDrop">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <p style="color:var(--text-secondary)">拖拽文件到此处或点击上传</p>
              <p style="font-size:11px;color:var(--text-tertiary);margin-top:8px">支持 TXT、Markdown、PDF、Word</p>
            </div>
            <input type="file" ref="fileInput" style="display:none" accept=".txt,.md,.pdf,.doc,.docx" @change="handleFileSelect">
          </div>

          <!-- 手动添加 -->
          <div v-if="importTab==='manual'">
            <div class="card" style="margin-bottom:16px">
              <div class="card-header"><span class="card-title">添加实体</span></div>
              <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end">
                <div><label class="form-label">名称</label><input class="input" v-model="manualEntity.name" placeholder="实体名称"></div>
                <div><label class="form-label">类型</label>
                  <select class="select" v-model="manualEntity.entity_type">
                    <option v-for="t in entityTypes" :value="t.value">{{t.label}}</option>
                  </select>
                </div>
                <div><label class="form-label">描述</label><input class="input" v-model="manualEntity.description" placeholder="可选"></div>
                <button class="btn btn-primary" @click="addManualEntity" style="align-self:end">添加</button>
              </div>
            </div>
            <div class="card">
              <div class="card-header"><span class="card-title">添加关系</span></div>
              <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end">
                <div><label class="form-label">源实体</label><input class="input" v-model="manualRelation.source" placeholder="源实体名称" list="entity-names"></div>
                <div><label class="form-label">目标实体</label><input class="input" v-model="manualRelation.target" placeholder="目标实体名称" list="entity-names"></div>
                <div><label class="form-label">关系类型</label>
                  <select class="select" v-model="manualRelation.relation_type">
                    <option value="related_to">相关</option><option value="works_at">工作于</option><option value="located_in">位于</option>
                    <option value="part_of">属于</option><option value="created">创造了</option><option value="uses">使用</option>
                    <option value="founded">创立了</option><option value="invested_in">投资了</option><option value="other">其他</option>
                  </select>
                </div>
                <button class="btn btn-primary" @click="addManualRelation" style="align-self:end">添加</button>
              </div>
            </div>
            <datalist id="entity-names"><option v-for="e in allEntities" :value="e.name"></datalist>
          </div>

          <!-- 分析结果预览 -->
          <div v-if="ingestResult" class="preview-section">
            <div class="card">
              <div class="card-header">
                <span class="card-title">分析结果预览</span>
                <button class="btn btn-ghost btn-sm" @click="ingestResult=null">清除</button>
              </div>
              <div v-if="ingestResult.entities&&ingestResult.entities.length">
                <h4 style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">识别到的实体 ({{ingestResult.entities.length}})</h4>
                <div style="margin-bottom:16px">
                  <span class="preview-entity" v-for="(e,i) in ingestResult.entities" :key="i">
                    <span class="entity-dot" :style="{background: getTypeColor(e.type)}"></span>
                    {{e.name}} <span style="color:var(--text-tertiary);font-size:10px">{{e.type}}</span>
                  </span>
                </div>
              </div>
              <div v-if="ingestResult.relations&&ingestResult.relations.length">
                <h4 style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">识别到的关系 ({{ingestResult.relations.length}})</h4>
                <div class="preview-relation" v-for="(r,i) in ingestResult.relations" :key="i">
                  <span style="color:var(--accent);font-weight:600">{{r.source}}</span>
                  <span style="color:var(--text-tertiary)">—[{{r.type}}]→</span>
                  <span style="color:var(--accent);font-weight:600">{{r.target}}</span>
                  <span v-if="r.evidence" style="color:var(--text-tertiary);font-size:10px;margin-left:auto">{{r.evidence}}</span>
                </div>
              </div>
              <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">
                <button class="btn btn-primary" @click="confirmImport">确认导入图谱</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ============ 查询页面 ============ -->
    <template v-if="page==='query'">
      <div class="toolbar">
        <div class="toolbar-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          智能查询
        </div>
        <div class="toolbar-spacer"></div>
        <button class="btn btn-secondary btn-sm" @click="queryMessages=[]">清空对话</button>
      </div>
      <div class="query-layout">
        <div class="query-main">
          <div class="query-messages" ref="queryMessagesEl">
            <div v-if="queryMessages.length===0" class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <p>输入问题开始查询知识图谱</p>
              <p style="font-size:11px;margin-top:4px">例如：张三和李四什么关系？</p>
            </div>
            <div v-for="msg in queryMessages" :key="msg.id" class="query-message" :class="msg.role">
              <div class="query-avatar">{{msg.role==='user'?'我':'AI'}}</div>
              <div class="query-bubble" v-html="msg.content"></div>
            </div>
            <div v-if="queryLoading" class="query-message ai">
              <div class="query-avatar">AI</div>
              <div class="query-bubble"><span class="spinner"></span> 思考中...</div>
            </div>
          </div>
          <div class="query-suggestions">
            <span class="suggestion-chip" @click="setQuery('图谱中有哪些实体类型？')">图谱中有哪些实体类型？</span>
            <span class="suggestion-chip" @click="setQuery('哪个实体的关系最多？')">哪个实体的关系最多？</span>
            <span class="suggestion-chip" @click="setQuery('请总结图谱中的主要信息')">请总结图谱中的主要信息</span>
          </div>
          <div class="query-input-bar">
            <input class="input" v-model="queryInput" placeholder="输入问题..." @keyup.enter="sendQuery">
            <button class="btn btn-primary" @click="sendQuery" :disabled="!queryInput.trim()||queryLoading">发送</button>
          </div>
        </div>
        <div class="query-sidebar">
          <h3 style="font-size:13px;font-weight:600;margin-bottom:12px">查询历史</h3>
          <div v-if="queryHistory.length===0" style="font-size:12px;color:var(--text-tertiary)">暂无历史</div>
          <div class="query-history-item" v-for="(h,i) in queryHistory" :key="i" @click="queryInput=h.question;sendQuery()">
            <div class="query-history-q">{{h.question}}</div>
            <div class="query-history-meta">{{h.time}}</div>
          </div>
        </div>
      </div>
    </template>

    <!-- ============ 分析页面 ============ -->
    <template v-if="page==='analysis'">
      <div class="toolbar">
        <div class="toolbar-title">

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

<script>
const { createApp, ref, reactive, computed, onMounted, nextTick, watch } = Vue;

const app = createApp({
  setup() {
    // ==================== 主题 ====================
    const themes = ['dark', 'light', 'warm', 'mint', 'violet'];
    const theme = ref(localStorage.getItem('kg-theme') || 'dark');
    const cycleTheme = () => {
      const idx = themes.indexOf(theme.value);
      theme.value = themes[(idx + 1) % themes.length];
      document.documentElement.setAttribute('data-theme', theme.value);
      localStorage.setItem('kg-theme', theme.value);
    };
    // 初始化主题
    document.documentElement.setAttribute('data-theme', theme.value);

    // ==================== 页面路由 ====================
    const page = ref(localStorage.getItem('kg-page') || 'graph');
    watch(page, (v) => {
      localStorage.setItem('kg-page', v);
      if (v === 'graph') nextTick(() => loadGraphData());
      if (v === 'analysis') nextTick(() => loadAnalysis());
      if (v === 'settings' && settingsTab.value === 'llm') loadLLMConfig();
    });

    // ==================== Toast ====================
    const toast = reactive({ show: false, message: '', type: 'info' });
    let toastTimer = null;
    const showToast = (message, type = 'info') => {
      toast.show = true; toast.message = message; toast.type = type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.show = false; }, 3000);
    };

    // ==================== API ====================
    const api = async (url, options = {}) => {
      try {
        const resp = await fetch(url, {
          headers: { 'Content-Type': 'application/json', ...options.headers },
          ...options,
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ detail: resp.statusText }));
          throw new Error(err.detail || '请求失败');
        }
        return await resp.json();
      } catch (e) {
        showToast(e.message, 'error');
        throw e;
      }
    };

    // ==================== 实体类型 ====================
    const entityTypes = [
      { value: 'person', label: '人物', color: 'var(--type-person)' },
      { value: 'organization', label: '组织', color: 'var(--type-organization)' },
      { value: 'location', label: '地点', color: 'var(--type-location)' },
      { value: 'concept', label: '概念', color: 'var(--type-concept)' },
      { value: 'event', label: '事件', color: 'var(--type-event)' },
      { value: 'technology', label: '技术', color: 'var(--type-technology)' },
      { value: 'product', label: '产品', color: 'var(--type-product)' },
      { value: 'other', label: '其他', color: 'var(--type-other)' },
    ];
    const typeColorMap = {};
    entityTypes.forEach(t => { typeColorMap[t.value] = t.color; });
    const getTypeColor = (type) => typeColorMap[type] || 'var(--type-other)';
    const getTypeLabel = (type) => {
      const found = entityTypes.find(t => t.value === type);
      return found ? found.label : type;
    };

    // ==================== 图谱页面 ====================
    const graphCanvas = ref(null);
    const graphSvg = ref(null);
    const graphSearch = ref('');
    const graphTypeFilter = ref('');
    const graphLayout = ref('force');
    const graphZoom = ref(1);
    const graphStats = reactive({ nodeCount: 0, edgeCount: 0 });
    const allEntities = ref([]);
    const filteredEntities = ref([]);
    const entityFilter = ref('');
    const entityTypeFilter = ref('');
    const selectedEntity = ref(null);
    const entityRelations = ref([]);
    const tooltip = reactive({ show: false, x: 0, y: 0, name: '', type: '', desc: '' });

    // D3图谱相关
    let simulation = null;
    let svgGroup = null;
    let zoomBehavior = null;
    let graphNodes = [];
    let graphEdges = [];

    const loadGraphData = async () => {
      try {
        const params = new URLSearchParams();
        if (graphTypeFilter.value) params.set('entity_types', graphTypeFilter.value);
        params.set('limit', '500');
        const data = await api(`/api/graph/data?${params}`);
        graphNodes = data.nodes || [];
        graphEdges = data.edges || [];
        graphStats.nodeCount = graphNodes.length;
        graphStats.edgeCount = graphEdges.length;
        allEntities.value = graphNodes;
        filterEntities();
        renderGraph();
      } catch (e) { /* handled by api */ }
    };

    const filterEntities = () => {
      let list = [...allEntities.value];
      if (entityTypeFilter.value) {
        list = list.filter(e => e.entity_type === entityTypeFilter.value);
      }
      if (entityFilter.value) {
        const q = entityFilter.value.toLowerCase();
        list = list.filter(e => e.name.toLowerCase().includes(q) || (e.description||'').toLowerCase().includes(q));
      }
      filteredEntities.value = list;
    };

    const renderGraph = () => {
      if (!graphSvg.value) return;
      const svg = d3.select(graphSvg.value);
      svg.selectAll('*').remove();

      const container = graphSvg.value.parentElement;
      const width = container.clientWidth;
      const height = container.clientHeight;

      svg.attr('width', width).attr('height', height);

      // 定义箭头
      const defs = svg.append('defs');
      defs.append('marker')
        .attr('id', 'arrowhead')
        .attr('viewBox', '0 -5 10 10')
        .attr('refX', 20)
        .attr('refY', 0)
        .attr('markerWidth', 6)
        .attr('markerHeight', 6)
        .attr('orient', 'auto')
        .append('path')
        .attr('d', 'M0,-5L10,0L0,5')
        .attr('fill', 'var(--graph-edge)');

      svgGroup = svg.append('g');

      // 缩放
      zoomBehavior = d3.zoom()
        .scaleExtent([0.1, 5])
        .on('zoom', (event) => {
          svgGroup.attr('transform', event.transform);
          graphZoom.value = event.transform.k;
        });
      svg.call(zoomBehavior);

      if (graphNodes.length === 0) {
        svgGroup.append('text')
          .attr('x', width / 2)
          .attr('y', height / 2)
          .attr('text-anchor', 'middle')
          .attr('fill', 'var(--text-tertiary)')
          .attr('font-size', '14px')
          .text('暂无数据，请先导入知识');
        return;
      }

      // 节点大小映射
      const degreeMap = {};
      graphEdges.forEach(e => {
        degreeMap[e.source] = (degreeMap[e.source] || 0) + 1;
        degreeMap[e.target] = (degreeMap[e.target] || 0) + 1;
      });
      const maxDegree = Math.max(1, ...Object.values(degreeMap));

      // 边
      const edgeGroup = svgGroup.append('g').attr('class', 'edges');
      const edges = edgeGroup.selectAll('line')
        .data(graphEdges)
        .enter()
        .append('line')
        .attr('stroke', 'var(--graph-edge)')
        .attr('stroke-width', d => Math.max(1, (d.weight || 1) * 0.5))
        .attr('marker-end', 'url(#arrowhead)');

      // 边标签
      const edgeLabelGroup = svgGroup.append('g').attr('class', 'edge-labels');
      const edgeLabels = edgeLabelGroup.selectAll('text')
        .data(graphEdges)
        .enter()
        .append('text')
        .attr('font-size', '9px')
        .attr('fill', 'var(--text-tertiary)')
        .attr('text-anchor', 'middle')
        .text(d => d.type);

      // 节点
      const nodeGroup = svgGroup.append('g').attr('class', 'nodes');
      const nodes = nodeGroup.selectAll('g')
        .data(graphNodes)
        .enter()
        .append('g')
        .style('cursor', 'pointer')
        .call(d3.drag()
          .on('start', (event, d) => {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x; d.fy = d.y;
          })
          .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
          .on('end', (event, d) => {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null; d.fy = null;
          })
        );

      // 节点圆形
      nodes.append('circle')
        .attr('r', d => {
          const degree = degreeMap[d.name] || 0;
          return 12 + (degree / maxDegree) * 20;
        })
        .attr('fill', d => getTypeColor(d.entity_type))
        .attr('stroke', d => getTypeColor(d.entity_type))
        .attr('stroke-width', 2)
        .attr('stroke-opacity', 0.3)
        .attr('fill-opacity', 0.8);

      // 节点文字
      nodes.append('text')
        .attr('dy', d => {
          const degree = degreeMap[d.name] || 0;
          return 12 + (degree / maxDegree) * 20 + 14;
        })
        .attr('text-anchor', 'middle')
        .attr('fill', 'var(--text-primary)')
        .attr('font-size', '11px')
        .text(d => d.name.length > 6 ? d.name.slice(0, 6) + '…' : d.name);

      // 节点交互
      nodes.on('click', (event, d) => {
        event.stopPropagation();
        selectEntity(d);
      })
      .on('mouseover', (event, d) => {
        tooltip.show = true;
        tooltip.x = event.clientX + 10;
        tooltip.y = event.clientY - 10;
        tooltip.name = d.name;
        tooltip.type = getTypeLabel(d.entity_type);
        tooltip.desc = d.description || '';
        // 高亮相关边
        edges.attr('stroke-opacity', e => (e.source.name === d.name || e.target.name === d.name) ? 0.8 : 0.05)
             .attr('stroke', e => (e.source.name === d.name || e.target.name === d.name) ? getTypeColor(d.entity_type) : 'var(--graph-edge)');
        edgeLabels.attr('opacity', e => (e.source.name === d.name || e.target.name === d.name) ? 1 : 0.1);
        nodes.selectAll('circle').attr('opacity', n => {
          if (n.name === d.name) return 1;
          const connected = graphEdges.some(e => (e.source.name === d.name && e.target.name === n.name) || (e.target.name === d.name && e.source.name === n.name));
          return connected ? 1 : 0.15;
        });
        nodes.selectAll('text').attr('opacity', n => {
          if (n.name === d.name) return 1;
          const connected = graphEdges.some(e => (e.source.name === d.name && e.target.name === n.name) || (e.target.name === d.name && e.source.name === n.name));
          return connected ? 1 : 0.15;
        });
      })
      .on('mouseout', () => {
        tooltip.show = false;
        edges.attr('stroke-opacity', null).attr('stroke', 'var(--graph-edge)');
        edgeLabels.attr('opacity', 1);
        nodes.selectAll('circle').attr('opacity', 1);
        nodes.selectAll('text').attr('opacity', 1);
      });

      // 点击空白取消选中
      svg.on('click', () => { selectedEntity.value = null; });

      // 力导向布局
      if (simulation) simulation.stop();
      simulation = d3.forceSimulation(graphNodes)
        .force('link', d3.forceLink(graphEdges).id(d => d.name).distance(100))
        .force('charge', d3.forceManyBody().strength(-200))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide(30))
        .on('tick', () => {
          edges
            .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
            .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
          edgeLabels
            .attr('x', d => (d.source.x + d.target.x) / 2)
            .attr('y', d => (d.source.y + d.target.y) / 2);
          nodes.attr('transform', d => `translate(${d.x},${d.y})`);
        });
    };

    const selectEntity = async (entity) => {
      selectedEntity.value = entity;
      try {
        const data = await api(`/api/entities/${encodeURIComponent(entity.name)}`);

      } catch (e) { entityRelations.value = []; }
    };

    const expandNeighbors = async () => {
      if (!selectedEntity.value) return;
      try {
        const data = await api('/api/graph/neighbors', {
          method: 'POST',
          body: JSON.stringify({ entity: selectedEntity.value.name, depth: 1 }),
        });
        // 合并新节点和边
        const existingNames = new Set(graphNodes.map(n => n.name));
        const newNodes = (data.nodes || []).filter(n => !existingNames.has(n.name));
        graphNodes = [...graphNodes, ...newNodes];
        graphEdges = [...graphEdges, ...(data.edges || [])];
        // 去重边
        const edgeSet = new Set();
        graphEdges = graphEdges.filter(e => {
          const key = `${e.source.name||e.source}-${e.target.name||e.target}-${e.type}`;
          if (edgeSet.has(key)) return false;
          edgeSet.add(key);
          return true;
        });
        graphStats.nodeCount = graphNodes.length;
        graphStats.edgeCount = graphEdges.length;
        allEntities.value = graphNodes;
        filterEntities();
        renderGraph();
      } catch (e) { /* handled */ }
    };

    const deleteSelectedEntity = async () => {
      if (!selectedEntity.value) return;
      try {
        await api(`/api/entities/${encodeURIComponent(selectedEntity.value.name)}`, { method: 'DELETE' });
        showToast('实体已删除', 'success');
        selectedEntity.value = null;
        loadGraphData();
      } catch (e) { /* handled */ }

    const searchGraphNodes = () => {
      if (!graphSearch.value.trim()) return;
      const found = graphNodes.find(n => n.name.includes(graphSearch.value));
      if (found) {
        selectEntity(found);
        // 居中到该节点
        if (svgGroup && found.x !== undefined) {
          const container = graphSvg.value.parentElement;
          const transform = d3.zoomIdentity
            .translate(container.clientWidth / 2, container.clientHeight / 2)
            .scale(1.5)
            .translate(-found.x, -found.y);
          d3.select(graphSvg.value).transition().duration(500).call(zoomBehavior.transform, transform);
        }
      } else {
        showToast('未找到匹配的实体', 'info');
      }
    };

    const focusNode = (name) => {
      graphSearch.value = name;
      nextTick(() => searchGraphNodes());
    };

    const highlightRelation = (rel) => {
      // 高亮特定关系
      if (!svgGroup) return;
      svgGroup.selectAll('.edges line')
        .attr('stroke', d => (d.source.name === rel.source && d.target.name === rel.target && d.type === rel.type) ? 'var(--accent)' : 'var(--graph-edge)')
        .attr('stroke-width', d => (d.source.name === rel.source && d.target.name === rel.target && d.type === rel.type) ? 3 : 1)
        .attr('stroke-opacity', d => (d.source.name === rel.source && d.target.name === rel.target && d.type === rel.type) ? 1 : 0.1);
      setTimeout(() => {
        if (svgGroup) {
          svgGroup.selectAll('.edges line')
            .attr('stroke', 'var(--graph-edge)')
            .attr('stroke-width', d => Math.max(1, (d.weight || 1) * 0.5))
            .attr('stroke-opacity', 1);
        }
      }, 2000);
    };

    const zoomIn = () => {
      if (!graphSvg.value || !zoomBehavior) return;
      d3.select(graphSvg.value).transition().duration(300).call(zoomBehavior.scaleBy, 1.3);
    };
    const zoomOut = () => {
      if (!graphSvg.value || !zoomBehavior) return;
      d3.select(graphSvg.value).transition().duration(300).call(zoomBehavior.scaleBy, 0.7);
    };
    const fitGraph = () => {
      if (!graphSvg.value || !zoomBehavior) return;
      const container = graphSvg.value.parentElement;
      d3.select(graphSvg.value).transition().duration(500)
        .call(zoomBehavior.transform, d3.zoomIdentity.translate(container.clientWidth/2, container.clientHeight/2).scale(0.8));
    };
    const resetGraph = () => { fitGraph(); selectedEntity.value = null; };
    const relayoutGraph = () => {
      // 重新布局
      if (simulation) {
        if (graphLayout.value === 'circular') {
          const container = graphSvg.value.parentElement;
          const cx = container.clientWidth / 2, cy = container.clientHeight / 2;
          const r = Math.min(cx, cy) * 0.6;
          graphNodes.forEach((n, i) => {
            const angle = (2 * Math.PI * i) / graphNodes.length;
            n.x = cx + r * Math.cos(angle);
            n.y = cy + r * Math.sin(angle);
            n.fx = n.x; n.fy = n.y;
          });
          simulation.alpha(0.3).restart();
          setTimeout(() => { graphNodes.forEach(n => { n.fx = null; n.fy = null; }); }, 1000);
        } else if (graphLayout.value === 'grid') {
          const container = graphSvg.value.parentElement;
          const cols = Math.ceil(Math.sqrt(graphNodes.length));
          const spacing = 120;
          const startX = (container.clientWidth - cols * spacing) / 2 + spacing / 2;
          const startY = 100;
          graphNodes.forEach((n, i) => {
            n.x = startX + (i % cols) * spacing;
            n.y = startY + Math.floor(i / cols) * spacing;
            n.fx = n.x; n.fy = n.y;
          });
          simulation.alpha(0.3).restart();
          setTimeout(() => { graphNodes.forEach(n => { n.fx = null; n.fy = null; }); }, 1000);
        } else {
          graphNodes.forEach(n => { n.fx = null; n.fy = null; });
          simulation.alpha(1).restart();
        }
      }
    };

            showToast('分析完成，请确认导入', 'success');

            showToast('分析失败: ' + (task.error || '未知错误'), 'error');
            importLoading.value = false;
            return;
          }

    // ==================== 查询页面 ====================

    const drawCharts = (stats) => {
      // 实体类型分布（简单SVG饼图）
      drawDonut(entityTypeChart.value, stats.entity_types || {});
      // 关系类型分布
      drawBar(relationTypeChart.value, stats.relation_types || {});
      // Top节点 - 用度分布
      if (centralityData.value.length) {
        drawBar(topNodesChart.value, Object.fromEntries(centralityData.value.map(n => [n.name, n.centrality || n.degree || 0])));
      }
    };

    const drawDonut = (container, data) => {
      if (!container) return;
      container.innerHTML = '';
      const entries = Object.entries(data);
      if (entries.length === 0) {
        container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-tertiary);font-size:12px">暂无数据</div>';
        return;
      }
      const total = entries.reduce((s, [, v]) => s + v, 0);
      const colors = ['#E91E63', '#2196F3', '#4CAF50', '#9C27B0', '#FF9800', '#00BCD4', '#795548', '#607D8B'];
      const w = container.clientWidth, h = 200, r = Math.min(w, h) / 2 - 20;
      const svg = d3.select(container).append('svg').attr('width', w).attr('height', h);
      const g = svg.append('g').attr('transform', `translate(${w/2},${h/2})`);

      let angle = 0;
      entries.forEach(([key, val], i) => {
        const sliceAngle = (val / total) * 2 * Math.PI;
        const x1 = r * Math.cos(angle);
        const y1 = r * Math.sin(angle);
        const x2 = r * Math.cos(angle + sliceAngle);
        const y2 = r * Math.sin(angle + sliceAngle);
        const large = sliceAngle > Math.PI ? 1 : 0;
        g.append('path')
          .attr('d', `M0,0L${x1},${y1}A${r},${r},0,${large},1,${x2},${y2}Z`)
          .attr('fill', colors[i % colors.length])
          .attr('opacity', 0.8);
        angle += sliceAngle;
      });

      // 图例
      const legend = svg.append('g').attr('transform', `translate(${w - 120}, 10)`);
      entries.forEach(([key, val], i) => {
        const lg = legend.append('g').attr('transform', `translate(0, ${i * 18})`);
        lg.append('rect').attr('width', 10).attr('height', 10).attr('rx', 2).attr('fill', colors[i % colors.length]);
        lg.append('text').attr('x', 14).attr('y', 9).attr('font-size', '10px').attr('fill', 'var(--text-secondary)').text(`${key} (${Math.round(val/total*100)}%)`);
      });
    };

    const drawBar = (container, data) => {
      if (!container) return;
      container.innerHTML = '';
      const entries = Object.entries(data).sort((a, b) => b[1] - a[1]).slice(0, 10);
      if (entries.length === 0) {
        container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-tertiary);font-size:12px">暂无数据</div>';
        return;
      }
      const w = container.clientWidth, h = 200;
      const barH = 16, gap = 4;
      const maxVal = Math.max(...entries.map(([, v]) => v));
      const svg = d3.select(container).append('svg').attr('width', w).attr('height', entries.length * (barH + gap) + 10);
      const colors = ['#E91E63', '#2196F3', '#4CAF50', '#9C27B0', '#FF9800', '#00BCD4', '#795548', '#607D8B', '#E91E63', '#2196F3'];

      entries.forEach(([key, val], i) => {
        const y = i * (barH + gap) + 5;
